name: Stale Issues & PRs

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    # ── NO job ceiling, and that is the DECISION, not its absence (objectui#7956) ──
    # This job runs under GitHub's 360-minute default. objectui#7956 asked for a
    # ceiling DERIVED from this job's own measured run-time distribution, in the
    # shape objectui#7270 left beside `lint.yml::lint`. It is recorded here
    # instead, because every run this job has to offer measures the wrong thing.
    #
    #   - Population: every completed run of this workflow, no status filter,
    #     window 2026-01-16T01:14Z .. 2026-09-06T00:19Z, n=234, all `schedule`.
    #     Measured 2026-09-06T17:24Z.
    #   - `?status=success` returns a `total_count` of 0 over that same window.
    #     This job has never once succeeded in the whole retained history.
    #   - Wall clock, from the Actions jobs endpoint: min 1s / median 2s /
    #     p95 4s / max 4s.
    #   - ⚠️ Those seconds are NOT this job's work. Ten runs sampled evenly
    #     across the window all report the same shape: a single step, `Set up
    #     job`, with conclusion `failure` — the `actions/stale` step below never
    #     starts. So the distribution above measures how fast this job fails to
    #     begin, and says nothing whatever about how long it takes to sweep this
    #     repository's issues and pull requests.
    #
    # ⛔ Do NOT derive 20-ish minutes from a 4-second maximum that belongs to a
    # setup failure. That would be a ceiling with the look of provenance and
    # none of the substance, sitting over a job whose real cost has never been
    # observed — and `actions/stale` pages the issue and pull-request lists,
    # which is the kind of work that grows with the repository. A ceiling set
    # under a job's honest slowest run converts a working job into a permanently
    # red one (objectui#7048); objectstack#16173 is the live counter-example,
    # where a distribution mis-estimated by ~2.6x killed a test shard while the
    # rollup read green. Here the mis-estimate would not be 2.6x, it would be
    # unbounded, because the numerator has never been measured at all.
    #
    # ⚠️ Two separate things are true and only one of them is objectui#7956's:
    # the exposure (no ceiling) is that card's, and the FAILURE (234 runs, 234
    # failures, never a success) is objectui#8126's — filed separately, because
    # bounding a job that cannot start would fix nothing and would hide the
    # louder defect behind a tidy-looking diff.
    #
    # What would change this: fix the setup failure, let a few real sweeps run,
    # then derive the number from THOSE the way `lint.yml::lint` documents,
    # write the derivation here, and move this job out of the accept-360 table
    # and into the `derived` table in
    # `scripts/__tests__/workflow-cache-save-bound.test.ts` in the same commit —
    # that pin holds this job's UNBOUNDED state deliberately, so adding a
    # ceiling has to be an edit someone makes on purpose rather than a silent
    # one.
    steps:
      # ── The SHA was FICTION, and that is the whole of objectui#8126 ──
      # `e00e804f6792d3fedb5bd3a27df2761c5f86c981` is not `actions/stale`'s
      # v9.0.0 commit. It is not any commit in that repository, so the runner
      # never got as far as this step:
      #
      #   ##[error]Unable to resolve action `actions/stale@e00e804f6792d3fedb5bd3a27df2761c5f86c981`,
      #   unable to find version `e00e804f6792d3fedb5bd3a27df2761c5f86c981`
      #
      # read verbatim from run 34172858995. Population re-derived 2026-09-08:
      # 236 completed `schedule` runs, of which run #1 (21052154491,
      # 2026-01-16T01:14:37Z) and run #236 are both `failure` — the job has
      # never once reached `actions/stale`. The comment was right all along;
      # only the SHA was wrong. ⚠️ `git log -S` CANNOT date the bad line: the
      # oldest commit this checkout can reach for this file is the shallow
      # boundary, so it reads as the file's creation and is not one.
      #
      # The replacement is MEASURED rather than looked up — the runner printed
      # the tag→SHA mapping itself, on a probe branch (run 34173534757):
      #
      #   Download action repository 'actions/stale@v9.0.0' (SHA:28ca1036281a5e5922ead5184a1bbf96e5fc984e)
      #
      # ⛔ Do not hand-edit this SHA and do not "tidy" it to a floating tag.
      # An unresolvable ref here is silent for eight months precisely because
      # nothing in this repository is downstream of this job.
      #
      # ── What turning it on actually does, measured before it was turned on ──
      # This file with only the SHA corrected, plus `debug-only: true` and a
      # read-only token, ran GREEN (34173608021) — the first success in this
      # workflow's life — and swept the OPEN board to exhaustion: 466 items
      # (457 issues, 9 PRs), and a `Statistics:` block carrying no stale, label
      # or comment counter at all. Nothing gets marked, nothing gets closed.
      # Control on the same file and the same day (34173673214), thresholds
      # dropped to 0: the block gains `New stale items: 125` / `Added items
      # labels: 125` / `Added items comments: 125`. So the zero above is a
      # reading off a working instrument, not an instrument that says nothing.
      # It is zero because the board is young: the oldest last-touch among 457
      # open issues is #5157 at 2026-08-21T08:18:51Z, 18 days, against a 60-day
      # threshold.
      #
      # ⚠️ That margin is the whole safety argument, and it expires. The exempt
      # sets below predate this repository's PM protocol: `pm:queue`,
      # `pm:on-hold` and `needs-user-decision` are NOT exempt, and those are the
      # cards parked on purpose waiting for a human. The first 60-day quiet
      # stretch on the board is when this job starts closing them. Whether that
      # is wanted is objectui#8126's open question, not this diff's.
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e  # v9.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues configuration
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. 
            It will be closed in 7 days if no further activity occurs. 
            
            If you believe this issue is still relevant, please:
            - Comment on this issue to keep it open
            - Add more details or context
            - Update to the latest version and confirm the issue still exists
            
            Thank you for your contributions!
          close-issue-message: |
            This issue has been automatically closed due to inactivity. 
            
            If you believe this issue should remain open, please:
            - Reopen the issue with updated information
            - Create a new issue with a detailed description and reproduction steps
            
            Thank you for your understanding!
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,critical,bug,enhancement'
          days-before-issue-stale: 60
          days-before-issue-close: 7
          
          # Pull requests configuration
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity. 
            It will be closed in 14 days if no further activity occurs.
            
            If you're still working on this PR:
            - Comment on this PR to keep it open
            - Rebase on the latest main branch
            - Address any review comments
            
            Thank you for your contributions!
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            
            If you'd like to continue working on this:
            - Reopen the PR and rebase on the latest main branch
            - Create a new PR with updated changes
            
            Thank you for your understanding!
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,in-progress,blocked'
          days-before-pr-stale: 45
          days-before-pr-close: 14
          
          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
