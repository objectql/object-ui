name: Stale Issues & PRs

# ⛔ THROWAWAY PROBE BRANCH (objectui#8126) — never merge.
# One job per candidate ref. `Set up job` resolves the ref before the step runs,
# so the job's FIRST step conclusion is the resolution reading.
# Every job is a dry run that writes nothing:
#   debug-only: true      -> the processor performs no operations
#   days-before-*: -1     -> nothing is ever marked stale or closed
# Permissions are read-only, narrower than the workflow on main.

on:
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read

jobs:
  control_checkout:
    # positive control: an action ref this repo resolves every day
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

  control_broken_sha:
    # negative control: the ref on main today
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@e00e804f6792d3fedb5bd3a27df2761c5f86c981
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: true
          days-before-stale: -1
          days-before-close: -1
          operations-per-run: 1

  stale_main:
    # does the action repository resolve at all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: true
          days-before-stale: -1
          days-before-close: -1
          operations-per-run: 1

  stale_master:
    # same question, other default-branch spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@master
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: true
          days-before-stale: -1
          days-before-close: -1
          operations-per-run: 1

  stale_v8:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: true
          days-before-stale: -1
          days-before-close: -1
          operations-per-run: 1

  stale_v9:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: true
          days-before-stale: -1
          days-before-close: -1
          operations-per-run: 1

  stale_v9_0_0:
    # the tag the comment on main claims the SHA is
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
