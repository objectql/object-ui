# THROWAWAY MEASUREMENT INSTRUMENT — objectui#5395. NOT TO BE MERGED.
#
# This file exists only on branch `claude/issue-5395-ci-cost-model-verification`
# and only to put a number on one question: what would a 4-way sharded coverage
# run cost in wall clock, and does the merged report stay equivalent to the
# unsharded one that `ci.yml`'s `test-coverage` job produces today?
#
# It changes NO gate. `ci.yml` is untouched on this branch; the production
# `test-coverage` job keeps its `timeout-minutes: 40`. The baseline job below
# carries a larger timeout because it is a measuring instrument, not a gate:
# a timeout would truncate the measurement, which is the one thing this file
# must not do.
#
# Results are emitted as GitHub annotations (`::error`/`::notice`) rather than
# left in the logs, because the measuring session's egress proxy blocks the
# Actions log/artifact CDN host; annotations come back through the REST API.
name: PROTO 5395 shard-coverage price

on:
  push:
    branches:
      - 'claude/issue-5395-ci-cost-model-verification'

permissions:
  contents: read

concurrency:
  group: proto-5395-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── A: the option being priced — coverage split 4 ways, blob reports merged ──
  proto-shard:
    name: PROTO coverage shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `main` is red for reasons this card does not own, so the suite exiting
      # non-zero is expected and must not stop the measurement.
      - name: Run tests with coverage (shard ${{ matrix.shard }}/4)
        id: shardrun
        continue-on-error: true
        run: pnpm exec vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/4
      - name: Show what the blob reporter wrote
        if: always()
        run: ls -la .vitest-reports/ || echo "::error title=PROTO-5395::no .vitest-reports directory from shard ${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proto-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ── B: merge the four blob reports into one coverage report ────────────────
  proto-merge:
    name: PROTO merge blob reports
    needs: proto-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: proto-blob-*
          path: .vitest-reports
          merge-multiple: true
      - run: ls -la .vitest-reports/
      - name: Merge reports and produce the coverage report
        id: mergerun
        continue-on-error: true
        run: pnpm exec vitest run --merge-reports --coverage --coverage.reporter=json --coverage.reporter=text
      - name: Summarise merged coverage
        if: always()
        run: node scripts-proto/summarise-coverage.mjs coverage/coverage-final.json MERGED
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proto-coverage-merged
          path: coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

  # ── C: the status quo, same commit, same runner class — the baseline ───────
  proto-baseline:
    name: PROTO unsharded coverage baseline
    runs-on: ubuntu-latest
    # Instrument, not a gate: production `test-coverage` keeps its 40 minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Byte-for-byte the production recipe from ci.yml's `test-coverage`.
      - name: Run tests with coverage
        id: baserun
        continue-on-error: true
        run: pnpm test:coverage --coverage.reporter=json --coverage.reporter=text
      - name: Summarise unsharded coverage
        if: always()
        run: node scripts-proto/summarise-coverage.mjs coverage/coverage-final.json UNSHARDED
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proto-coverage-unsharded
          path: coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

  # ── D: is the merged report equivalent to the unsharded one? ──────────────
  proto-compare:
    name: PROTO compare merged vs unsharded
    needs: [proto-merge, proto-baseline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: proto-coverage-merged
          path: merged
      - uses: actions/download-artifact@v7
        with:
          name: proto-coverage-unsharded
          path: unsharded
      - name: Compare
        run: node scripts-proto/compare-coverage.mjs unsharded/coverage-final.json merged/coverage-final.json
